
name: Online-Boutique CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            dockerfile: src/frontend/Dockerfile
            context: src/frontend

          - service: adservice
            dockerfile: src/adservice/Dockerfile
            context: src/adservice

          - service: cartservice
            dockerfile: src/cartservice/src/Dockerfile
            context: src/cartservice/src

          - service: checkoutservice
            dockerfile: src/checkoutservice/Dockerfile
            context: src/checkoutservice

          - service: currencyservice
            dockerfile: src/currencyservice/Dockerfile
            context: src/currencyservice

          - service: emailservice
            dockerfile: src/emailservice/Dockerfile
            context: src/emailservice

          - service: paymentservice
            dockerfile: src/paymentservice/Dockerfile
            context: src/paymentservice

          - service: productcatalogservice
            dockerfile: src/productcatalogservice/Dockerfile
            context: src/productcatalogservice

          - service: recommendationservice
            dockerfile: src/recommendationservice/Dockerfile
            context: src/recommendationservice

          - service: shippingservice
            dockerfile: src/shippingservice/Dockerfile
            context: src/shippingservice

          - service: loadgenerator
            dockerfile: src/loadgenerator/Dockerfile
            context: src/loadgenerator

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      # - name: Build Docker Image
      #   run: |
      #     docker build \
      #       -f ${{ matrix.dockerfile }} \
      #       -t microservices-demo/${{ matrix.service }}:latest \
      #       ${{ matrix.context }}

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
             -f ${{ matrix.dockerfile }} \
             -t $REGISTRY/cloudcart/${{ matrix.service }}:$IMAGE_TAG \
             -t $REGISTRY/cloudcart/${{ matrix.service }}:latest \
             ${{ matrix.context }}
          
          docker push $REGISTRY/cloudcart/${{ matrix.service }}:$IMAGE_TAG
          docker push $REGISTRY/cloudcart/${{ matrix.service }}:latest